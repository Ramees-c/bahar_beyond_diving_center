<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Courses | Admin | Diving With Afshin</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-dark-theme text-white d-flex flex-column min-vh-100">
    <!-- Page Loader -->
    <div id="loader-wrapper">
      <div class="loader-content">
        <div class="loader-bubbles">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <!-- Admin Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary border-opacity-10 py-3">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img src="assets/images/dive with afshin logo-02.png" alt="Logo" class="navbar-logo" />
        </a>
        <div class="ms-auto d-flex align-items-center">
          <a href="admin_dashboard.html" class="text-accent text-decoration-none me-4 d-none d-sm-inline fw-semibold ls-1">
            <i class="bi bi-grid-fill me-2"></i>DASHBOARD
          </a>
          <a href="admin_login.html" class="btn btn-outline-light rounded-pill px-4 py-2 fw-medium">
            <i class="bi bi-box-arrow-right me-2"></i>LOGOUT
          </a>
        </div>
      </div>
    </nav>

    <main class="flex-grow-1 py-5">
      <div class="container">
        <!-- Header Actions -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-5 gap-3">
          <div>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb mb-2 fs-sm">
                <li class="breadcrumb-item"><a href="admin_dashboard.html" class="text-light-muted text-decoration-none">Dashboard</a></li>
                <li class="breadcrumb-item active text-accent" aria-current="page">Courses</li>
              </ol>
            </nav>
            <h1 class="h2 fw-bold font-outfit mb-0 text-white">Manage Courses</h1>
          </div>
          <button class="btn btn-accent rounded-pill px-4 py-2 fw-bold">
            <i class="bi bi-plus-lg me-2"></i>ADD NEW COURSE
          </button>
        </div>

        <!-- Courses Table Container -->
        <div class="contact-glass-form p-3 p-md-4 animateElements">
          <div class="table-responsive">
            <table class="table admin-table align-middle mb-0">
              <thead>
                <tr>
                  <th scope="col">Image</th>
                  <th scope="col">Course Title</th>
                  <th scope="col">Level</th>
                  <th scope="col">Price</th>
                  <th scope="col">Home Page</th>
                  <th scope="col" class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody>
                <!-- Discovery Scuba -->
                <tr>
                  <td>
                    <img src="https://images.unsplash.com/photo-1682687172507-14763b937f5e?auto=format&fit=crop&w=800&q=80" alt="Discovery" class="rounded-3" style="width: 80px; height: 50px; object-fit: cover; border: 1px solid rgba(var(--accent-rgb), 0.2);">
                  </td>
                  <td>
                    <div class="fw-semibold text-white">Discovery Scuba Diving</div>
                    <div class="fs-sm text-light-muted opacity-50 mb-0">Half Day • 12m Depth</div>
                  </td>
                  <td>
                    <span class="badge bg-accent-dark text-accent border border-accent border-opacity-25 rounded-pill px-3">Beginner</span>
                  </td>
                  <td class="fw-bold text-white">50 OMR</td>
                  <td>
                    <div class="form-check form-switch">
                      <input class="form-check-input custom-switch" type="checkbox" role="switch" checked>
                    </div>
                  </td>
                  <td class="text-end">
                    <button class="btn btn-sm btn-outline-light rounded-circle btn-action mx-1" title="Edit">
                      <i class="bi bi-pencil-square"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-light rounded-circle btn-action mx-1 text-danger-hover" title="Delete">
                      <i class="bi bi-trash"></i>
                    </button>
                  </td>
                </tr>

                <!-- Open Water -->
                <tr>
                  <td>
                    <img src="https://images.unsplash.com/photo-1582967788606-a171c1080cb0?auto=format&fit=crop&w=800&q=80" alt="Open Water" class="rounded-3" style="width: 80px; height: 50px; object-fit: cover; border: 1px solid rgba(var(--accent-rgb), 0.2);">
                  </td>
                  <td>
                    <div class="fw-semibold text-white">PADI Open Water Diver</div>
                    <div class="fs-sm text-light-muted opacity-50 mb-0">3-5 Days • 18m Depth</div>
                  </td>
                  <td>
                    <span class="badge bg-accent-dark text-accent border border-accent border-opacity-25 rounded-pill px-3">Certification</span>
                  </td>
                  <td class="fw-bold text-white">200 OMR</td>
                  <td>
                    <div class="form-check form-switch">
                      <input class="form-check-input custom-switch" type="checkbox" role="switch" checked>
                    </div>
                  </td>
                  <td class="text-end">
                    <button class="btn btn-sm btn-outline-light rounded-circle btn-action mx-1" title="Edit">
                      <i class="bi bi-pencil-square"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-light rounded-circle btn-action mx-1 text-danger-hover" title="Delete">
                      <i class="bi bi-trash"></i>
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-darker py-4 border-top border-secondary border-opacity-10 mt-auto">
      <div class="container text-center">
        <p class="text-light-muted opacity-50 mb-0 fs-sm">
          &copy; 2024 Diving With Afshin Admin Dashboard
        </p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password | Admin | Diving With Afshin</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-dark-theme text-white d-flex flex-column min-vh-100">
    <!-- Page Loader -->
    <div id="loader-wrapper">
      <div class="loader-content">
        <div class="loader-bubbles">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <main class="login-section py-5">
      <div class="container">
        <!-- Form Container -->
        <div class="row justify-content-center px-2">
          <div class="col-lg-5 col-md-7 col-sm-10 col-12">
            <div class="contact-glass-form p-4 p-sm-5 animateElements">
              <div class="text-center mb-4">
                <img
                  src="assets/images/dive with afshin logo-02.png"
                  alt="Diving With Afshin Logo"
                  class="login-logo mb-4"
                />
              </div>
              <form id="passwordForm" class="needs-validation" novalidate>
                <div class="mb-3 mb-md-4">
                  <label class="form-label text-light-muted fs-sm ms-2 mb-2"
                    >New Password</label
                  >
                  <input
                    type="password"
                    id="newPassword"
                    class="form-control custom-input py-3 px-4 rounded-3 text-white"
                    placeholder="Enter new password"
                    required
                  />
                  <div class="invalid-feedback fs-sm ms-2">
                    Please provide a new password.
                  </div>
                </div>
                <div class="mb-3 mb-md-4">
                  <label class="form-label text-light-muted fs-sm ms-2 mb-2"
                    >Confirm New Password</label
                  >
                  <input
                    type="password"
                    id="confirmPassword"
                    class="form-control custom-input py-3 px-4 rounded-3 text-white"
                    placeholder="Confirm new password"
                    required
                  />
                  <div class="invalid-feedback fs-sm ms-2">
                    Passwords must match.
                  </div>
                </div>
                <div class="d-flex flex-column gap-3 pt-3">
                  <button
                    type="submit"
                    class="btn btn-accent rounded-pill px-5 py-3 fw-bold ls-1 w-100"
                  >
                    UPDATE PASSWORD
                  </button>
                  <a
                    href="admin_dashboard.html"
                    class="btn btn-outline-light rounded-pill px-4 py-3 fw-medium text-center w-100"
                    >CANCEL</a
                  >
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
    <script>
      // Password matching validation
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("passwordForm");
        const newPass = document.getElementById("newPassword");
        const confirmPass = document.getElementById("confirmPassword");

        form.addEventListener(
          "submit",
          function (event) {
            if (newPass.value !== confirmPass.value) {
              confirmPass.setCustomValidity("Passwords do not match");
            } else {
              confirmPass.setCustomValidity("");
            }

            if (!form.checkValidity()) {
              event.preventDefault();
              event.stopPropagation();
            }
            form.classList.add("was-validated");
          },
          false,
        );
      });
    </script>
  </body>
</html>

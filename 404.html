<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Lost at Sea | Diving With Afshin</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body class="bg-dark-theme text-white d-flex flex-column min-vh-100 page-404">
    <!-- Page Loader -->
    <div id="loader-wrapper">
      <div class="loader-content">
        <div class="loader-bubbles">
          <span
            style="left: -30px; width: 20px; height: 20px; animation-delay: 0s"
          ></span>
          <span
            style="left: 50px; width: 12px; height: 12px; animation-delay: 0.4s"
          ></span>
          <span
            style="left: 10px; width: 16px; height: 16px; animation-delay: 1.2s"
          ></span>
          <span
            style="
              left: -60px;
              width: 10px;
              height: 10px;
              animation-delay: 1.8s;
            "
          ></span>
          <span
            style="left: 80px; width: 22px; height: 22px; animation-delay: 2.2s"
          ></span>
        </div>
      </div>
    </div>

    <!-- 404 Content -->
    <main class="flex-grow-1 d-flex align-items-center py-6">
      <div class="container">
        <div class="row justify-content-center text-center">
          <div class="col-lg-10">
            <div class="contact-glass-form p-5 animateElements">
              <div class="mb-4">
                <h1
                  class="display-1 fw-bold font-outfit text-accent mb-0"
                  style="font-size: clamp(6rem, 20vw, 12rem); line-height: 1"
                >
                  404
                </h1>
                <p class="subtitle text-accent ls-2 fw-semibold">LOST AT SEA</p>
              </div>

              <div class="mb-5">
                <h2 class="h3 fw-bold font-outfit text-white mb-3">
                  Looks like you've drifted too far...
                </h2>
                <p class="text-light-muted opacity-75 fs-6">
                  The page you are looking for has been moved or doesn't exist.
                  Let's get you back to familiar waters.
                </p>
              </div>

              <div
                class="d-flex flex-column flex-sm-row gap-3 justify-content-center"
              >
                <a
                  href="index.html"
                  class="btn btn-accent rounded-pill px-5 py-3 fw-bold ls-1"
                >
                  RETURN TO SURFACE
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/script.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Diving With Afshin</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-dark-theme text-white d-flex flex-column min-vh-100">
    <!-- Page Loader -->
    <div id="loader-wrapper">
      <div class="loader-content">
        <div class="loader-bubbles">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <!-- Simplified Admin Navigation -->
    <nav
      class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary border-opacity-10 py-3"
    >
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img
            src="assets/images/dive with afshin logo-02.png"
            alt="Logo"
            class="navbar-logo"
          />
        </a>
        <div class="ms-auto d-flex align-items-center">
          <span class="text-accent me-4 d-none d-sm-inline fw-semibold ls-1"
            >ADMIN PANEL</span
          >
          <a
            href="admin_login.html"
            class="btn btn-outline-light rounded-pill px-4 py-2 fw-medium"
          >
            <i class="bi bi-box-arrow-right me-2"></i>LOGOUT
          </a>
        </div>
      </div>
    </nav>

    <main class="flex-grow-1 d-flex align-items-center py-6">
      <div class="container">
        <div class="row justify-content-center g-3 g-md-4">
          <!-- Courses Card -->
          <div class="col-lg-4 col-md-6 col-11">
            <a href="admin_courses.html" class="text-decoration-none">
              <div class="contact-glass-form admin-card p-4 text-center h-100 animateElements">
                <div class="icon-box bg-accent-dark text-accent rounded-circle d-flex align-items-center justify-content-center mx-auto mb-4 border border-accent border-opacity-25">
                  <i class="bi bi-journal-text fs-1"></i>
                </div>
                <h2 class="h4 fw-bold font-outfit text-white mb-0">Courses</h2>
              </div>
            </a>
          </div>

          <!-- Packages Card -->
          <div class="col-lg-4 col-md-6 col-11">
            <a href="admin_packages.html" class="text-decoration-none">
              <div class="contact-glass-form admin-card p-4 text-center h-100 animateElements">
                <div class="icon-box bg-accent-dark text-accent rounded-circle d-flex align-items-center justify-content-center mx-auto mb-4 border border-accent border-opacity-25">
                  <i class="bi bi-box-seam fs-1"></i>
                </div>
                <h2 class="h4 fw-bold font-outfit text-white mb-0">Packages</h2>
              </div>
            </a>
          </div>

          <!-- Gallery Card -->
          <div class="col-lg-4 col-md-6 col-11">
            <a href="admin_gallery.html" class="text-decoration-none">
              <div class="contact-glass-form admin-card p-4 text-center h-100 animateElements">
                <div class="icon-box bg-accent-dark text-accent rounded-circle d-flex align-items-center justify-content-center mx-auto mb-4 border border-accent border-opacity-25">
                  <i class="bi bi-images fs-1"></i>
                </div>
                <h2 class="h4 fw-bold font-outfit text-white mb-0">Gallery</h2>
              </div>
            </a>
          </div>

          <!-- Client Reviews Card -->
          <div class="col-lg-4 col-md-6 col-11">
            <a href="admin_reviews.html" class="text-decoration-none">
              <div class="contact-glass-form admin-card p-4 text-center h-100 animateElements">
                <div class="icon-box bg-accent-dark text-accent rounded-circle d-flex align-items-center justify-content-center mx-auto mb-4 border border-accent border-opacity-25">
                  <i class="bi bi-star fs-1"></i>
                </div>
                <h2 class="h4 fw-bold font-outfit text-white mb-0">Client Reviews</h2>
              </div>
            </a>
          </div>

          <!-- FAQ Card -->
          <div class="col-lg-4 col-md-6 col-11">
            <a href="admin_faq.html" class="text-decoration-none">
              <div class="contact-glass-form admin-card p-4 text-center h-100 animateElements">
                <div class="icon-box bg-accent-dark text-accent rounded-circle d-flex align-items-center justify-content-center mx-auto mb-4 border border-accent border-opacity-25">
                  <i class="bi bi-question-circle fs-1"></i>
                </div>
                <h2 class="h4 fw-bold font-outfit text-white mb-0">FAQ</h2>
              </div>
            </a>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-darker py-4 border-top border-secondary border-opacity-10">
      <div class="container text-center">
        <p class="text-light-muted opacity-50 mb-0 fs-sm">
          &copy; 2024 Diving With Afshin Admin Dashboard
        </p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>

</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Gallery | Admin | Diving With Afshin</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
      .preview-item {
        position: relative;
        aspect-ratio: 1;
      }
      .preview-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .remove-btn {
        position: absolute;
        top: -8px;
        right: -8px;
        background: #ff6b6b;
        color: white;
        border: none;
        border-radius: 50%;
        width: 26px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        cursor: pointer;

        transition: transform 0.2s ease;
      }
      .remove-btn:hover {
        transform: scale(1.1);
      }
    </style>
  </head>
  <body class="bg-dark-theme text-white d-flex flex-column min-vh-100">
    <!-- Admin Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary border-opacity-10 py-3">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img src="assets/images/dive with afshin logo-02.png" alt="Logo" class="navbar-logo" />
        </a>
        <div class="ms-auto d-flex align-items-center">
          <a href="admin_dashboard.html" class="text-accent text-decoration-none me-4 d-none d-sm-inline fw-semibold ls-1">
            <i class="bi bi-grid-fill me-2"></i>DASHBOARD
          </a>
          <a href="admin_login.html" class="btn btn-outline-light rounded-pill px-4 py-2 fw-medium">
            <i class="bi bi-box-arrow-right me-2"></i>LOGOUT
          </a>
        </div>
      </div>
    </nav>

    <main class="flex-grow-1 py-5">
      <div class="container">
        <div class="mb-5">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-2 fs-sm">
              <li class="breadcrumb-item"><a href="admin_dashboard.html" class="text-light-muted text-decoration-none">Dashboard</a></li>
              <li class="breadcrumb-item"><a href="admin_gallery.html" class="text-light-muted text-decoration-none">Gallery</a></li>
              <li class="breadcrumb-item active text-accent" aria-current="page">Add Media</li>
            </ol>
          </nav>
          <h1 class="h2 fw-bold font-outfit mb-0 text-white">Upload New Media</h1>
          <p class="text-light-muted fs-sm opacity-75 mt-2">You can upload up to 12 images at a time.</p>
        </div>

        <div class="row justify-content-center">
          <div class="col-12">
            <div class="contact-glass-form p-4 p-md-5 animateElements">
              <div id="dropZone" class="upload-zone mb-4" onclick="document.getElementById('fileInput').click()">
                <i class="bi bi-cloud-arrow-up text-accent display-4 mb-3 d-block"></i>
                <p class="mb-0 fw-medium">Drag & drop images here or <span class="text-accent">browse files</span></p>
                <input type="file" id="fileInput" multiple accept="image/*" hidden>
              </div>

              <div id="previewGrid" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3 mb-4 d-none">
                <!-- Previews injected here -->
              </div>

              <div class="d-flex flex-column flex-sm-row gap-3">
                <button id="uploadBtn" class="btn btn-accent rounded-pill px-5 py-3 fw-bold ls-1 flex-grow-1" disabled>
                  START UPLOAD
                </button>
                <a href="admin_gallery.html" class="btn btn-outline-light rounded-pill px-4 py-3 fw-medium text-center">CANCEL</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const fileInput = document.getElementById('fileInput');
      const previewGrid = document.getElementById('previewGrid');
      const uploadBtn = document.getElementById('uploadBtn');
      let selectedFiles = [];

      fileInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        if (selectedFiles.length + files.length > 12) {
          alert('Maximum 12 images allowed per upload session.');
          return;
        }
        
        files.forEach(file => {
          if (!file.type.startsWith('image/')) return;
          selectedFiles.push(file);
          
          const reader = new FileReader();
          reader.onload = (event) => {
            const div = document.createElement('div');
            div.className = 'col animateElements';
            div.innerHTML = `
              <div class="preview-item">
                <img src="${event.target.result}" alt="Preview">
                <button type="button" class="remove-btn" onclick="removeFile(this, '${file.name}')">
                  <i class="bi bi-x-lg"></i>
                </button>
              </div>
            `;
            previewGrid.appendChild(div);
          };
          reader.readAsDataURL(file);
        });

        updateUI();
      });

      function removeFile(btn, fileName) {
        selectedFiles = selectedFiles.filter(f => f.name !== fileName);
        btn.closest('.col').remove();
        updateUI();
      }

      function updateUI() {
        if (selectedFiles.length > 0) {
          previewGrid.classList.remove('d-none');
          uploadBtn.disabled = false;
        } else {
          previewGrid.classList.add('d-none');
          uploadBtn.disabled = true;
        }
      }
    </script>
  </body>
</html>

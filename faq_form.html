<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAQ Form | Admin | Diving With Afshin</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-dark-theme text-white d-flex flex-column min-vh-100">
    <!-- Page Loader -->
    <div id="loader-wrapper">
      <div class="loader-content">
        <div class="loader-bubbles">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <!-- Admin Navigation -->
    <nav
      class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary border-opacity-10 py-3"
    >
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img
            src="assets/images/dive with afshin logo-02.png"
            alt="Logo"
            class="navbar-logo"
          />
        </a>
        <div class="ms-auto d-flex align-items-center">
          <a
            href="admin_dashboard.html"
            class="text-accent text-decoration-none me-4 d-none d-sm-inline fw-semibold ls-1"
          >
            <i class="bi bi-grid-fill me-2"></i>DASHBOARD
          </a>
          <a
            href="admin_login.html"
            class="btn btn-outline-light rounded-pill px-4 py-2 fw-medium"
          >
            <i class="bi bi-box-arrow-right me-2"></i>LOGOUT
          </a>
        </div>
      </div>
    </nav>

    <main class="flex-grow-1 py-5">
      <div class="container">
        <!-- Header -->
        <div class="mb-5">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-2 fs-sm">
              <li class="breadcrumb-item">
                <a
                  href="admin_dashboard.html"
                  class="text-light-muted text-decoration-none"
                  >Dashboard</a
                >
              </li>
              <li class="breadcrumb-item">
                <a
                  href="admin_faq.html"
                  class="text-light-muted text-decoration-none"
                  >FAQ</a
                >
              </li>
              <li
                class="breadcrumb-item active text-accent"
                aria-current="page"
              >
                Add New
              </li>
            </ol>
          </nav>
          <h1 class="h2 fw-bold font-outfit mb-0 text-white">Add New FAQ</h1>
        </div>

        <!-- Form Container -->
        <div class="row justify-content-center">
          <div class="col-12 col-md-10 col-lg-8">
            <div class="contact-glass-form p-4 p-md-5 animateElements">
              <form id="faqForm" class="needs-validation" novalidate>
                <div class="mb-3 mb-md-4">
                  <label class="form-label text-light-muted fs-sm ms-2 mb-2"
                    >Question</label
                  >
                  <input
                    type="text"
                    class="form-control custom-input py-3 px-4 rounded-3 text-white"
                    placeholder="Enter the question here..."
                    required
                  />
                </div>
                <div class="mb-3 mb-md-4">
                  <label class="form-label text-light-muted fs-sm ms-2 mb-2"
                    >Answer</label
                  >
                  <textarea
                    class="form-control custom-input py-3 px-4 rounded-3 text-white"
                    rows="6"
                    placeholder="Provide the detailed answer..."
                    required
                  ></textarea>
                </div>
                <div class="d-flex flex-column flex-sm-row gap-3 pt-3">
                  <button
                    type="submit"
                    class="btn btn-accent rounded-pill px-5 py-3 fw-bold ls-1 w-100"
                  >
                    SAVE FAQ
                  </button>
                  <a
                    href="admin_faq.html"
                    class="btn btn-outline-light rounded-pill px-4 py-3 fw-medium text-center w-100"
                    >CANCEL</a
                  >
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-darker py-4 border-top border-secondary border-opacity-10 mt-auto">
      <div class="container text-center">
        <p class="text-light-muted opacity-50 mb-0 fs-sm">
          &copy; 2024 Diving With Afshin Admin Dashboard
        </p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Diving With Afshin</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body class="bg-dark-theme text-white d-flex flex-column min-vh-100">
    <!-- Page Loader -->
    <div id="loader-wrapper">
      <div class="loader-content">
        <div class="loader-bubbles">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <!-- Login Section -->
    <main class="login-section py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-5 col-md-6 col-sm-9">
            <div class="contact-glass-form p-4 animateElements">
              <div class="text-center mb-4">
                <img
                  src="assets/images/dive with afshin logo-02.png"
                  alt="Diving With Afshin Logo"
                  class="login-logo mb-4"
                />
                <p class="subtitle text-accent mb-2 ls-2 fw-semibold">
                  SECURE ACCESS
                </p>
                <h1 class="h2 fw-bold font-outfit mb-0">Admin Login</h1>
              </div>

              <form id="contactForm" class="needs-validation" novalidate>
                <div class="mb-3">
                  <label class="form-label text-light-muted fs-sm ms-2 mb-2"
                    >Username</label
                  >
                  <input
                    type="text"
                    class="form-control bg-dark border-secondary border-opacity-25 text-white py-3 px-4 rounded-3 shadow-none custom-input"
                    placeholder="Admin Username"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label text-light-muted fs-sm ms-2 mb-2"
                    >Password</label
                  >
                  <input
                    type="password"
                    class="form-control bg-dark border-secondary border-opacity-25 text-white py-3 px-4 rounded-3 shadow-none custom-input"
                    placeholder="••••••••"
                    required
                  />
                </div>

                <button
                  type="submit"
                  class="btn btn-accent rounded-pill px-5 py-2 fw-bold w-100 ls-1 mt-2"
                >
                  AUTHENTICATE
                </button>
              </form>

              <div class="text-center mt-4">
                <a
                  href="index.html"
                  class="text-light-muted fs-sm text-decoration-none text-white-hover"
                >
                  <i class="bi bi-arrow-left me-1"></i> Return to Site
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
  </body>
</html>
